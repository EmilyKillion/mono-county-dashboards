<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #1a2332;
    --muted: #5b6b7c;
    --line: #e2e6ea;
    --bg: #fdfcfa;
    --covid-case: #b3472b;
    --covid-ww: #2f6690;
    --flu-case: #9c6b1f;
    --flu-ww: #4d7c3f;
    --rsv-case: #7a4a8f;
    --rsv-ww: #2f8f8a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 24px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 19px; font-weight: 650; margin: 0 0 2px 0; }
  .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--muted);
    user-select: none;
  }
  .tab.active { color: #fff; border-color: transparent; }
  .tab[data-d="covid"].active { background: var(--covid-case); }
  .tab[data-d="flu"].active { background: var(--flu-case); }
  .tab[data-d="rsv"].active { background: var(--rsv-case); }
  .controls {
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
    margin-bottom: 10px; font-size: 12.5px; color: var(--muted);
  }
  .controls label { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .legend { display: flex; gap: 18px; margin-bottom: 8px; font-size: 12.5px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  svg { width: 100%; height: auto; display: block; }
  .axis-label { font-size: 11px; fill: var(--muted); }
  .grid-line { stroke: var(--line); stroke-width: 1; }
  .tick-text { font-size: 10.5px; fill: var(--muted); }
  .case-bar { opacity: 0.82; }
  .case-bar:hover { opacity: 1; }
  .ww-line { fill: none; stroke-width: 2; }
  .ww-dot { stroke: var(--bg); stroke-width: 1; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--ink); color: #fff;
    font-size: 11.5px; padding: 7px 10px; border-radius: 5px; line-height: 1.5;
    opacity: 0; transition: opacity 0.1s; white-space: nowrap; z-index: 10;
  }
  .note {
    font-size: 12px; color: var(--muted); margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--line); line-height: 1.6;
  }
  .chart-container { position: relative; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Mono County: Confirmed Cases vs. Wastewater Signal</h1>
  <div class="sub">Weekly, Oct 2024 &ndash; present &middot; Mammoth Community Water District &middot; wastewater normalized to PMMoV</div>

  <div class="tabs">
    <div class="tab active" data-d="covid">SARS-CoV-2</div>
    <div class="tab" data-d="flu">Influenza</div>
    <div class="tab" data-d="rsv">RSV</div>
  </div>

  <div class="legend" id="legend"></div>
  <div class="controls">
    <label><input type="checkbox" id="logToggle"> Log scale for wastewater axis</label>
    <label><input type="checkbox" id="smoothToggle" checked> 3-week rolling average (wastewater)</label>
  </div>

  <div class="chart-container">
    <svg id="chart" viewBox="0 0 960 460"></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="note" id="footnote"></div>
</div>

const DISEASE_CFG = {
  covid: {label: 'SARS-CoV-2', caseKey: 'covid_cases', wwKey: 'covid_ww', nKey: 'covid_ww_n',
          caseColor: 'var(--covid-case)', wwColor: 'var(--covid-ww)',
          caseColorHex: '#b3472b', wwColorHex: '#2f6690',
          title: 'Mono County SARS-CoV-2: Confirmed Cases vs. Wastewater Signal',
          caseNote: 'Confirmed cases, Mono County residents only.'},
  flu: {label: 'Influenza', caseKey: 'flu_cases', wwKey: 'flu_ww', nKey: 'flu_ww_n',
        caseColor: 'var(--flu-case)', wwColor: 'var(--flu-ww)',
        caseColorHex: '#9c6b1f', wwColorHex: '#4d7c3f',
        title: 'Mono County Influenza: Initial Reports vs. Wastewater Signal',
        caseNote: 'Initial reports (Influenza A + B combined, not confirmation-status filtered \u2014 field not present in source). Wastewater is FLUAV + FLUBV combined.'},
  rsv: {label: 'RSV', caseKey: 'rsv_cases', wwKey: 'rsv_ww', nKey: 'rsv_ww_n',
        caseColor: 'var(--rsv-case)', wwColor: 'var(--rsv-ww)',
        caseColorHex: '#7a4a8f', wwColorHex: '#2f8f8a',
        title: 'Mono County RSV: Initial Reports vs. Wastewater Signal',
        caseNote: 'Initial reports (not confirmation-status filtered \u2014 field not present in source). Wastewater target: RSV-A + RSV-B combined.'}
};

let currentDisease = 'covid';

const margin = {top: 20, right: 66, bottom: 46, left: 55};
const width = 960, height = 460;
const plotW = width - margin.left - margin.right;
const plotH = height - margin.top - margin.bottom;

function rollingMean(arr, w) {
  return arr.map((_, i) => {
    const lo = Math.max(0, i - Math.floor(w/2));
    const hi = Math.min(arr.length, i + Math.floor(w/2) + 1);
    const slice = arr.slice(lo, hi).filter(v => v !== null && !isNaN(v));
    return slice.length ? slice.reduce((a,b) => a+b, 0) / slice.length : null;
  });
}

const dates = raw.map(d => new Date(d.week_ending + 'T00:00:00'));

function render() {
  const cfg = DISEASE_CFG[currentDisease];
  const useLog = document.getElementById('logToggle').checked;
  const useSmooth = document.getElementById('smoothToggle').checked;

  document.getElementById('title').textContent = cfg.title;
  document.getElementById('legend').innerHTML = `
    <div class="legend-item"><span class="swatch" style="background:${cfg.caseColorHex}"></span>${cfg.label} cases (weekly count)</div>
    <div class="legend-item"><span class="swatch" style="background:${cfg.wwColorHex}; border-radius:50%;"></span>Wastewater, PMMoV-normalized (weekly mean)</div>
  `;

  const cases = raw.map(d => d[cfg.caseKey]);
  const wwRaw = raw.map(d => d[cfg.wwKey]);
  const ww = useSmooth ? rollingMean(wwRaw, 3) : wwRaw;

  const svg = document.getElementById('chart');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

  const n = raw.length;
  const xScale = i => margin.left + (i / (n - 1)) * plotW;
  const barW = Math.max(2, plotW / n * 0.62);

  const maxCases = Math.max(1, ...cases);
  const yCasesScale = v => margin.top + plotH - (v / maxCases) * plotH;

  const wwVals = ww.filter(v => v !== null && v > 0);
  const maxWW = Math.max(1, ...ww.filter(v => v !== null));
  const minWWLog = wwVals.length ? Math.max(0.5, Math.min(...wwVals)) : 1;
  function yWWScale(v) {
    if (v === null) return null;
    if (useLog) {
      const vv = Math.max(v, minWWLog * 0.5);
      const logMax = Math.log10(maxWW);
      const logMin = Math.log10(minWWLog * 0.5);
      return margin.top + plotH - ((Math.log10(vv) - logMin) / (logMax - logMin)) * plotH;
    }
    return margin.top + plotH - (v / maxWW) * plotH;
  }

  function svgEl(tag, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  const nTicksY = 5;
  for (let t = 0; t <= nTicksY; t++) {
    const v = (maxCases / nTicksY) * t;
    const y = yCasesScale(v);
    svg.appendChild(svgEl('line', {x1: margin.left, x2: width - margin.right, y1: y, y2: y, class: 'grid-line'}));
    const lbl = svgEl('text', {x: margin.left - 8, y: y + 3, class: 'tick-text', 'text-anchor': 'end'});
    lbl.textContent = Math.round(v);
    svg.appendChild(lbl);
  }
  const yAxisLabel = svgEl('text', {x: 14, y: margin.top + plotH/2, class: 'axis-label', 'text-anchor': 'middle', transform: `rotate(-90, 14, ${margin.top + plotH/2})`});
  yAxisLabel.textContent = `${cfg.label} cases / week`;
  svg.appendChild(yAxisLabel);

  for (let t = 0; t <= nTicksY; t++) {
    let v, y;
    if (useLog) {
      const logMax = Math.log10(maxWW);
      const logMin = Math.log10(minWWLog * 0.5);
      const logV = logMin + (logMax - logMin) * (t / nTicksY);
      v = Math.pow(10, logV);
      y = yWWScale(v);
    } else {
      v = (maxWW / nTicksY) * t;
      y = yWWScale(v);
    }
    const lbl = svgEl('text', {x: width - margin.right + 8, y: y + 3, class: 'tick-text', 'text-anchor': 'start'});
    lbl.textContent = v >= 100 ? Math.round(v) : v.toFixed(1);
    svg.appendChild(lbl);
  }
  const yAxisLabel2 = svgEl('text', {x: width - 14, y: margin.top + plotH/2, class: 'axis-label', 'text-anchor': 'middle', transform: `rotate(-90, ${width-14}, ${margin.top + plotH/2})`});
  yAxisLabel2.textContent = 'WW conc. / PMMoV (norm. units)';
  svg.appendChild(yAxisLabel2);

  const step = Math.ceil(n / 12);
  for (let i = 0; i < n; i += step) {
    const x = xScale(i);
    const lbl = svgEl('text', {x: x, y: margin.top + plotH + 18, class: 'tick-text', 'text-anchor': 'middle'});
    lbl.textContent = dates[i].toLocaleDateString('en-US', {month: 'short', year: '2-digit'});
    svg.appendChild(lbl);
  }

  const tooltip = document.getElementById('tooltip');
  const chartContainer = document.querySelector('.chart-container');

  for (let i = 0; i < n; i++) {
    const x = xScale(i) - barW/2;
    const y = yCasesScale(cases[i]);
    const h = margin.top + plotH - y;
    const rect = svgEl('rect', {x, y, width: barW, height: Math.max(0,h), class: 'case-bar', fill: cfg.caseColorHex});
    rect.addEventListener('mousemove', (e) => showTip(e, i));
    rect.addEventListener('mouseleave', hideTip);
    svg.appendChild(rect);
  }

  let pathD = '';
  ww.forEach((v, i) => {
    if (v === null) return;
    const x = xScale(i);
    const y = yWWScale(v);
    pathD += (pathD === '' ? 'M' : 'L') + x + ',' + y + ' ';
  });
  svg.appendChild(svgEl('path', {d: pathD, class: 'ww-line', stroke: cfg.wwColorHex}));

  ww.forEach((v, i) => {
    if (v === null) return;
    const x = xScale(i);
    const y = yWWScale(v);
    const dot = svgEl('circle', {cx: x, cy: y, r: 2.6, class: 'ww-dot', fill: cfg.wwColorHex});
    dot.addEventListener('mousemove', (e) => showTip(e, i));
    dot.addEventListener('mouseleave', hideTip);
    svg.appendChild(dot);
  });

  function showTip(e, i) {
    const rectBox = chartContainer.getBoundingClientRect();
    tooltip.innerHTML = `<b>Week of ${dates[i].toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}</b><br>
      ${cfg.label} cases: ${cases[i]}<br>
      WW (norm.${useSmooth ? ', smoothed' : ''}): ${ww[i] !== null ? ww[i].toFixed(1) : 'n/a'}<br>
      WW samples that week: ${raw[i][cfg.nKey]}`;
    tooltip.style.left = (e.clientX - rectBox.left + 14) + 'px';
    tooltip.style.top = (e.clientY - rectBox.top - 10) + 'px';
    tooltip.style.opacity = 1;
  }
  function hideTip() { tooltip.style.opacity = 0; }

  document.getElementById('footnote').innerHTML =
    `${n} weekly observations, ${cases.reduce((a,b)=>a+b,0)} ${cfg.label.toLowerCase()} cases in window. ${cfg.caseNote} ` +
    `Wastewater normalized as (gene copies/L) &divide; (PMMoV copies/L), scaled &times;10&sup6; for readability.`;
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentDisease = tab.dataset.d;
    render();
  });
});
document.getElementById('logToggle').addEventListener('change', render);
document.getElementById('smoothToggle').addEventListener('change', render);
render();
</script>
</body>
</html>
